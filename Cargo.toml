[package]
name = "bridge-solver"
version = "0.5.0"
edition = "2021"
license = "GPL-2.0-only"
description = "Bridge Double-Dummy Solver - Port of macroxue/bridge-solver"
repository = "https://github.com/bridge-craftwork/bridge-solver"
keywords = ["bridge", "double-dummy", "solver", "cards"]
categories = ["games", "algorithms"]

[features]
default = []
cli = ["clap"]

# Double-dummy cardplay analysis (src/analyse_play.rs): per-card costs and
# alternatives. Optional so callers wanting only a DD result do not pull serde
# and sha2. Enabled by the HTTP service and the WebAssembly build.
play-analysis = ["serde", "sha2"]

# Debug features
debug_mtdf = []
debug_fast = []
debug_search = []
no_tricks_pruning = []
no_fast_tricks = []
no_slow_tricks = []

[[bin]]
name = "solver-diag"
path = "src/bin/solver-diag/main.rs"
required-features = ["cli"]

[[bin]]
name = "bridge-solver"
path = "src/bin/bridge-solver/main.rs"
required-features = ["cli"]

# Declared so the featureless `clippy --all-targets` pass skips it rather than
# failing to compile: it uses `analyse_play`, which is gated behind
# `play-analysis`.
[[example]]
name = "bench_fixtures"
path = "examples/bench_fixtures.rs"
required-features = ["play-analysis"]

[[example]]
name = "time_optimal_line"
path = "examples/time_optimal_line.rs"
required-features = ["play-analysis"]

[dependencies]
bridge-types = { git = "https://github.com/bridge-craftwork/bridge-types" }
clap = { version = "4", features = ["derive"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
sha2 = { version = "0.10", optional = true }
