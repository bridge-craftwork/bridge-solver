<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bridge double-dummy analysis — in your browser</title>
    <meta
      name="description"
      content="Paste a PBN board, a LIN file or a BBO handviewer URL and get the double-dummy table plus every card that gave a trick away. Runs entirely in your browser — the hand is never uploaded."
    />

    <!--
      This policy is the enforcement behind the "nothing is uploaded" claim. The
      browser applies it, not this page's own code, so the page cannot opt out of
      it or quietly work around it.

      connect-src 'self' is the important one: it blocks fetch, XMLHttpRequest,
      WebSocket, EventSource and navigator.sendBeacon to every origin except the
      one this page was served from. 'self' rather than 'none' only because the
      WebAssembly module is itself fetched from here; the origin is GitHub Pages,
      which serves static files and has nothing that could receive an upload.

      'wasm-unsafe-eval' in script-src is required to instantiate WebAssembly at
      all. Despite the name it does not enable eval() — it permits compiling a
      wasm module and nothing else.

      worker-src 'self' is needed because the solver runs in a Web Worker; a
      twelve-board file is several seconds of compute and would otherwise freeze
      the page.

      style-src allows 'unsafe-inline' because Vue applies scoped component
      styles and this app sets card tints as inline style attributes. It is the
      one loosening here, and it is not a data-exfiltration path: CSS cannot make
      a network request that connect-src and img-src do not already govern.

      form-action 'none' stops the page navigating your data anywhere as a form
      submission, which is the other common way bytes leave a browser.

      (frame-ancestors is deliberately absent — it is ignored in a meta tag and
      only works as a real HTTP header, which GitHub Pages does not let us set.)
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'none';
        script-src 'self' 'wasm-unsafe-eval';
        worker-src 'self' blob:;
        style-src 'self' 'unsafe-inline';
        img-src 'self' data:;
        font-src 'self';
        connect-src 'self';
        form-action 'none';
        base-uri 'none';
        object-src 'none';
      "
    />

    <meta name="referrer" content="no-referrer" />
    <meta name="color-scheme" content="light" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♠</text></svg>"
    />
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <p style="max-width: 60ch; margin: 2rem auto; font-family: system-ui, sans-serif">
        This page analyses bridge hands in your browser, which needs JavaScript
        and WebAssembly. Nothing is sent to a server either way.
      </p>
    </noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
