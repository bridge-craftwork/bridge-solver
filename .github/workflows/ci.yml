name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust }}

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2

    - name: Build library
      run: cargo build --verbose

    - name: Build CLI binaries
      run: cargo build --features cli --verbose

    - name: Run tests
      # Not `--all-features`: that switches on the debug features
      # (no_tricks_pruning, no_fast_tricks, ...) which alter solver results.
      run: cargo test --workspace --features cli,play-analysis

    - name: Build release
      run: cargo build --features cli --release --verbose

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Run clippy (library)
      run: cargo clippy --workspace --all-targets -- -D warnings

    - name: Run clippy (cli + play-analysis)
      run: cargo clippy --workspace --all-targets --features cli,play-analysis -- -D warnings

  # `wasm/` is a separate workspace (it path-depends on this crate), so the jobs
  # above never reach it: `--workspace` here does not include it. Without this
  # job its tests never run and a wasm32 regression — the `Instant` trap class of
  # problem, which compiles fine and only fails at runtime — ships unnoticed.
  wasm:
    name: WebAssembly
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
        targets: wasm32-unknown-unknown

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: wasm

    - name: Check formatting
      working-directory: wasm
      run: cargo fmt --all -- --check

    - name: Run clippy
      working-directory: wasm
      run: cargo clippy --all-targets -- -D warnings

    # Native, so the LIN-parsing tests actually execute.
    - name: Run tests
      working-directory: wasm
      run: cargo test

    # The target that matters: everything above can pass while wasm32 fails.
    - name: Build for wasm32
      working-directory: wasm
      run: cargo build --target wasm32-unknown-unknown --release

  # The Pages site. Its own build runs only on main, so this is what catches a
  # broken site on a pull request.
  web:
    name: Web
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: wasm

    - name: Install Node
      uses: actions/setup-node@v4
      with:
        # Vite 7 wants 20.19+ or 22.12+; 22 resolves to the latest 22.x.
        node-version: 22
        cache: npm
        cache-dependency-path: web/package-lock.json

    - name: Install wasm-pack
      uses: jetli/wasm-pack-action@v0.4.0
      with:
        version: latest

    - name: Install dependencies
      working-directory: web
      run: npm ci

    - name: Build the WebAssembly bundle
      working-directory: web
      run: npm run wasm

    - name: Run tests
      working-directory: web
      run: npm test

    - name: Build the site
      working-directory: web
      run: npm run build

  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [test, lint, wasm, web]

    steps:
    - name: Summary
      run: |
        echo "All tests passed"
        echo "All platforms (Linux, Windows, macOS) built successfully"
        echo "WebAssembly target built and its tests passed"
        echo "The Pages site built and its tests passed"
        echo "Code formatting and linting passed"
