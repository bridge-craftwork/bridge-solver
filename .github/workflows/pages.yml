name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'wasm/**'
      - 'web/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/pages.yml'
      # The Cloudflare half of the deploy: a change to the ingest Function or to
      # the bindings has to redeploy too, and without these it silently would
      # not — the site would keep serving while the Function went stale.
      - 'functions/**'
      - 'wrangler.jsonc'
  # Lets the site be redeployed without a code change.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Latest wins: a superseded deploy has nothing worth finishing.
concurrency:
  group: pages
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Read here rather than inside the step so the step's `if` can test them: a
  # fork, or this repo before the secrets are set, should still build and deploy
  # to GitHub Pages rather than failing on a credential it was never given.
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wasm

      - uses: actions/setup-node@v4
        with:
          # Vite 7 wants 20.19+ or 22.12+; 22 resolves to the latest 22.x.
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # PINNED, not `latest`. This action resolves `latest` by asking the
      # GitHub API, and when that call fails it does not fail the step — it
      # silently falls back to its own default, wasm-pack v0.9.1, whose
      # wasm-opt is too old to parse what wasm-bindgen emits. The build then
      # dies with "Only 1 table definition allowed in MVP", which names
      # nothing relevant. pdf-handouts hit exactly that on 2026-09-01.
      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: 'v0.15.0'

      - name: Install dependencies
        working-directory: web
        run: npm ci

      # Before the site build: Vite bundles the generated module as an asset, so
      # it has to exist on disk first.
      - name: Build the WebAssembly bundle
        working-directory: web
        run: npm run wasm

      - name: Run the site tests
        working-directory: web
        run: npm test

      - name: Build the site
        working-directory: web
        run: npm run build

      # A missing wasm asset produces a page that loads and then quietly fails to
      # analyse anything, so fail here instead.
      - name: Check the bundle landed
        working-directory: web
        run: |
          test -f dist/index.html
          # The gallery is a second entry point; a rollupOptions mistake would drop
          # it silently rather than fail the build.
          test -f dist/gallery.html
          ls dist/assets/*.wasm
          ls dist/assets/*.js
          du -sh dist

      # Cloudflare, from the same build that GitHub Pages is about to get, so the
      # two hosts cannot drift. Only Cloudflare has the `/t` ingest Function and
      # the KV and Analytics Engine bindings; GitHub Pages serves the same static
      # site with the beacon inert against it.
      #
      # Skipped when the token is absent so a fork still builds. `--commit-dirty`
      # because the checkout carries the generated wasm module, which wrangler
      # would otherwise refuse to deploy from as an unclean tree.
      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx --yes wrangler@4 pages deploy --commit-dirty=true

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # `deploy-pages` caps its own timeout at the 600000 ms default; a larger
      # `with: timeout` is silently clamped rather than honoured.
      - id: deployment
        uses: actions/deploy-pages@v4
